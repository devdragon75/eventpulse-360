# Full stack: MySQL + Kafka (KRaft, no ZooKeeper) + the Spring Boot API.
#   docker compose up --build
# Swagger UI: http://localhost:8080/swagger-ui.html
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: eventpulse
      MYSQL_USER: eventpulse
      MYSQL_PASSWORD: eventpulse
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/eventpulse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: eventpulse
      DB_PASSWORD: eventpulse
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Demo defaults only - set real values in a .env file for anything beyond local use.
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-local-demo-secret-1234}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@eventpulse.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}

volumes:
  mysql-data:
