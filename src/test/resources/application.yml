spring:
  datasource:
    url: jdbc:h2:mem:eventpulse;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=10000
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  data:
    web:
      pageable:
        max-page-size: 100

eventpulse:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret
    expiration: 1h
  admin:
    name: Test Admin
    email: admin@test.local
    password: AdminPass123!
  kafka:
    enabled: false
